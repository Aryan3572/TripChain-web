services:
  - type: web
    name: tripchain-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CHAIN_ID
        value: 31337
      - key: WEB3_RPC_URL
        value: http://127.0.0.1:8545
      - key: GOOGLE_CLIENT_ID
        sync: false
