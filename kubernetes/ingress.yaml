apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripchain-ingress
  labels:
    app: tripchain
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50k"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: tripchain-backend-service
            port:
              number: 5000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: tripchain-backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tripchain-frontend-service
            port:
              number: 80
