apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripchain-hardhat
  labels:
    app: tripchain-hardhat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tripchain-hardhat
  template:
    metadata:
      labels:
        app: tripchain-hardhat
    spec:
      containers:
      - name: tripchain-hardhat
        image: tripchain-hardhat:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8545
          name: rpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 8545
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8545
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
