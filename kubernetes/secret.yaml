apiVersion: v1
kind: Secret
metadata:
  name: tripchain-secrets
type: Opaque
stringData:
  # Database Configuration (NeonDB / Supabase / Render Postgres)
  DATABASE_URL: "postgresql://user:password@host:5432/neondb?sslmode=require&connect_timeout=15"
  DIRECT_URL: "postgresql://user:password@host:5432/neondb?sslmode=require"

  # Server & Authentication
  PORT: "5000"
  JWT_SECRET: "replace_with_a_long_random_64_character_jwt_secret_in_production"
  GOOGLE_CLIENT_ID: "replace_with_google_web_client_id.apps.googleusercontent.com"
  FRONTEND_URL: "http://localhost:8080,http://localhost:3000,https://tripchain-web.vercel.app"

  # Email Notifications (Alerts & Login Notifications)
  ADMIN_NOTIFICATION_EMAIL: "beingaryan5555@gmail.com"
  GMAIL_USER: "beingaryan5555@gmail.com"
  GMAIL_APP_PASSWORD: "replace_with_16_digit_gmail_app_password"

  # Distributed Cache (In-cluster Redis or external Upstash URL)
  # Default uses in-cluster service: redis://tripchain-redis-service:6379
  REDIS_URL: "redis://tripchain-redis-service:6379"

  # Web3 & Decentralized Eco-Rewards
  # Option A: In-Cluster Hardhat Node (Chain 31337)
  CHAIN_ID: "31337"
  WEB3_RPC_URL: "http://tripchain-hardhat-service:8545"
  WEB3_VALIDATOR_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

  # Option B (Production Testnet - e.g. Sepolia Chain 11155111):
  # CHAIN_ID: "11155111"
  # WEB3_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
  # WEB3_VALIDATOR_PRIVATE_KEY: "replace_with_validator_private_key"
