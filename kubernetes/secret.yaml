apiVersion: v1
kind: Secret
metadata:
  name: tripchain-secrets
type: Opaque
stringData:
  # Base64 encoded values are not needed for stringData
  # Database Configuration
  DATABASE_URL: "REPLACE_WITH_NEON_POOLED_DATABASE_URL"
  DIRECT_URL: "REPLACE_WITH_NEON_DIRECT_DATABASE_URL"

  # Server & Authentication
  PORT: "5000"
  JWT_SECRET: "REPLACE_WITH_A_LONG_RANDOM_JWT_SECRET"
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"

  # Email Notifications (Optional/Alerts)
  ADMIN_NOTIFICATION_EMAIL: "beingaryan5555@gmail.com"
  GMAIL_USER: "beingaryan5555@gmail.com"
  GMAIL_APP_PASSWORD: "REPLACE_WITH_GMAIL_APP_PASSWORD"

  # Distributed Cache (Optional - e.g. redis://tripchain-redis-service:6379 or Upstash URL)
  REDIS_URL: "redis://tripchain-redis-service:6379"

  # Web3 & Decentralized Eco-Rewards (Hardhat Localhost or Testnet)
  CHAIN_ID: "31337"
  WEB3_RPC_URL: "http://tripchain-hardhat-service:8545"
  WEB3_VALIDATOR_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
