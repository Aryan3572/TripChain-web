apiVersion: v1
kind: Secret
metadata:
  name: tripchain-secrets
type: Opaque
stringData:
  # Base64 encoded values are not needed for stringData
  # Backend variables
  DATABASE_URL: "REPLACE_WITH_NEON_POOLED_DATABASE_URL"
  DIRECT_URL: "REPLACE_WITH_NEON_DIRECT_DATABASE_URL"
  PORT: "5000"
  JWT_SECRET: "REPLACE_WITH_A_LONG_RANDOM_JWT_SECRET"
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"
